name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build (Linux)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCASCADE and SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev

      - name: Install Quicklisp
        run: |
          curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
               --load /tmp/quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(let ((init-file (merge-pathnames ".sbclrc" (user-homedir-pathname)))) (with-open-file (s init-file :direction :output :if-exists :append :if-does-not-exist :create) (format s "~%#-quicklisp~%(let ((quicklisp-init (merge-pathnames \"quicklisp/setup.lisp\" (user-homedir-pathname)))) (when (probe-file quicklisp-init) (load quicklisp-init)))~%")))'

      - name: Build C wrapper
        run: |
          if [ -f Makefile ]; then
            make c-wrapper
          elif [ -f c-wrapper/Makefile ]; then
            cd c-wrapper && make
          fi

      - name: Register project with ASDF
        run: |
          mkdir -p ~/common-lisp
          ln -sf "$(pwd)" ~/common-lisp/clad

      - name: Build binary
        run: |
          sbcl --non-interactive \
               --load src/cli/build.lisp \
               "clad-linux-amd64"

      - name: Verify binary
        run: |
          chmod +x clad-linux-amd64
          ./clad-linux-amd64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clad-linux-amd64
          path: clad-linux-amd64

  build-macos:
    runs-on: macos-latest
    name: Build (macOS)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCASCADE and SBCL
        run: |
          brew install opencascade sbcl

      - name: Install Quicklisp
        run: |
          curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
               --load /tmp/quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(let ((init-file (merge-pathnames ".sbclrc" (user-homedir-pathname)))) (with-open-file (s init-file :direction :output :if-exists :append :if-does-not-exist :create) (format s "~%#-quicklisp~%(let ((quicklisp-init (merge-pathnames \"quicklisp/setup.lisp\" (user-homedir-pathname)))) (when (probe-file quicklisp-init) (load quicklisp-init)))~%")))'

      - name: Build C wrapper
        run: |
          if [ -f Makefile ]; then
            make c-wrapper
          elif [ -f c-wrapper/Makefile ]; then
            cd c-wrapper && make
          fi

      - name: Register project with ASDF
        run: |
          mkdir -p ~/common-lisp
          ln -sf "$(pwd)" ~/common-lisp/clad

      - name: Build binary
        run: |
          sbcl --non-interactive \
               --load src/cli/build.lisp \
               "clad-macos-arm64"

      - name: Verify binary
        run: |
          chmod +x clad-macos-arm64
          ./clad-macos-arm64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clad-macos-arm64
          path: clad-macos-arm64

  build-windows:
    runs-on: windows-latest
    name: Build (Windows)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-opencascade
            mingw-w64-x86_64-sbcl
            curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quicklisp
        run: |
          curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
               --load /tmp/quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(let ((init-file (merge-pathnames ".sbclrc" (user-homedir-pathname)))) (with-open-file (s init-file :direction :output :if-exists :append :if-does-not-exist :create) (format s "~%#-quicklisp~%(let ((quicklisp-init (merge-pathnames \"quicklisp/setup.lisp\" (user-homedir-pathname)))) (when (probe-file quicklisp-init) (load quicklisp-init)))~%")))'

      - name: Build C wrapper
        run: |
          if [ -f Makefile ]; then
            make c-wrapper
          elif [ -f c-wrapper/Makefile ]; then
            cd c-wrapper && make
          fi

      - name: Register project with ASDF
        run: |
          mkdir -p ~/common-lisp
          ln -sf "$(pwd)" ~/common-lisp/clad

      - name: Build binary
        run: |
          sbcl --non-interactive \
               --load src/cli/build.lisp \
               "clad-windows-amd64.exe"

      - name: Verify binary
        run: ./clad-windows-amd64.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clad-windows-amd64.exe
          path: clad-windows-amd64.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clad-linux-amd64/clad-linux-amd64
            clad-macos-arm64/clad-macos-arm64
            clad-windows-amd64.exe/clad-windows-amd64.exe
